name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Offline assertions against saved page fixtures — no network, no alerts.
      # Catches a broken parser before it silently reports "not purchasable"
      # forever.
      - run: node test-tracker.js
